replicaCount: 1

# Nobody publishes this component. The tag is the source commit the hook builds.
image:
  repository: ghcr.io/paulscherrerinstitute/scicat-ci/pan-ontologies-api
  tag: 2d95561b8a3f47a61e41e26db9587089000eda8e
  pullPolicy: Always

service:
  type: ClusterIP
  externalPort: 80
  internalPort: 3000

ingress:
  enabled: true
  annotations: 
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: "{{ .Values.host }}"
      paths: 
        - path: "/"
          pathType: Prefix
  tls:
    - hosts:
      - "{{ .Values.host }}"
      secretName: "scicat-ont-certificate"

# Keep the pre-rename chart name so selectors and resource names still match
# releases installed from the vendored charts (Deployment selectors are immutable).
nameOverride: generic-service-chart

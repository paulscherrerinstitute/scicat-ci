envValue: development

doiPrefix: "10.83766"

registerDoiUri: https://api.test.datacite.org/dois

host: scicat.development.psi.ch

ingresses:
  - enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: 50m
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/whitelist-source-range: "{{ .Values.secretsJson.OPENEM_WHITELISTED_CIDRS }}"
      nginx.ingress.kubernetes.io/configuration-snippet: |-
        if ($http_origin ~* (^https://www\.openem\.ch$)) {
          more_set_headers 'Access-Control-Allow-Origin: $http_origin';
        }

    hosts:
      - host: "{{ .Values.host }}"
        paths:
          - path: "/"
            pathType: Prefix
    tls:
      - hosts:
        - "{{ .Values.host }}"
        secretName: "scicat-be-next-certificate"

migrateCommand: npm run migrate:db:up

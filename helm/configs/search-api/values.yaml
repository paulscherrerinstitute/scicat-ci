replicaCount: 1

# Nobody publishes this component. The tag is the source commit the hook builds.
image:
  repository: ghcr.io/paulscherrerinstitute/scicat-ci/search-api
  tag: e88adfb267f21f68d485fefbb65c8fb697c8deec
  pullPolicy: Always

service:
  type: ClusterIP
  externalPort: 80
  internalPort: 3000

ingress:
  enabled: true
  annotations: 
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: "{{ .Values.host }}"
      paths: 
        - path: "/panosc-api"
          pathType: Prefix
        - path: "/panosc-explorer"
          pathType: Prefix
  tls:
    - hosts:
      - "{{ .Values.host }}"
      secretName: "scicat-be-next-certificate"

env:
  - name: BASE_URL
    value: "{{ .Values.baseUrl }}"
  - name: FACILITY
    value: PSI
  - name: PANET_BASE_URL
    value: "{{ .Values.panetBaseUrl }}"
  - name: PSS_ENABLE
    value: "true"
  - name: PASS_DOCUMENTS_TO_SCORING
    value: "false"
  - name: PSS_BASE_URL
    value: "{{ .Values.pssBaseUrl }}"

configMaps: 
  "{{ .Release.Name }}-cm":
    config.json: "{{ .Values.CONFIG }}"
    component-config.json: "{{ .Values.COMPONENT_CONFIG }}"

volumes:
  - name: config-volume
    configMap:
      name: "{{ .Release.Name }}-cm"

volumeMounts:
  - name: config-volume
    mountPath: /home/node/app/server/config.json
    subPath: config.json
  - name: config-volume
    mountPath: /home/node/app/server/component-config.json
    subPath: component-config.json

# Keep the pre-rename chart name so selectors and resource names still match
# releases installed from the vendored charts (Deployment selectors are immutable).
nameOverride: generic-service-chart

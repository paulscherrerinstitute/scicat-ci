image:
  repository: ghcr.io/paulscherrerinstitute/scicat-ci/proposals
  tag: 7cbd4a9f256ea55d4bebcce5e800fa74f60ad3ac

env:
  - name: SCICAT_ENDPOINT
    value: "{{ .Values.scicatEndpoint }}"
  - name: DUO_ENDPOINT
    value: https://duo.psi.ch/duo/api.php/v1/

volumes:
  - name: secrets-volume
    secret:
      secretName: "{{ .Release.Name }}-s"

secrets: 
  "{{ .Release.Name }}-s":
    type: Opaque
    data: 
      .env: "{{ .Values.secretsJson.PROPOSAL_ENV }}"

volumeMounts:
  - name: secrets-volume
    mountPath: /usr/src/proposals/.env
    subPath: .env

cronjob:
  ttlSecondsAfterFinished: 691200 # 8 days (7+1 of buffer)

# Keep the pre-rename chart name so resource names stay stable for the
# release installed from the vendored duo_facility_proposals chart.
nameOverride: proposals-cronjob-chart

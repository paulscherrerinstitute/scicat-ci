replicaCount: 1

# An empty sourceRepo pulls a published image.
# To deploy a commit nobody published, set all three fields.
# sourceRepo is the git repository to build.
# ciRepository must be ghcr.io/paulscherrerinstitute/scicat-ci/<release>, the only
# path the deploy token can push to.
# ciTag is the commit sha to build, and it becomes the image tag.
# An environment folder can override the three fields to build for that environment.
sourceRepo: ""
ciRepository: ghcr.io/paulscherrerinstitute/scicat-rocrate
ciTag: "2.6.0"

image:
  repository: "{{ .Values.ciRepository }}"
  tag: "{{ .Values.ciTag }}"
  pullPolicy: Always

service:
  type: ClusterIP
  externalPort: 80
  internalPort: 8080
  probePath: /api/v1/health/live

ingress:
  enabled: true
  annotations:
    # required since nginx routes only /api/v1/zenodo, causing the HTTP-01
    # ACME challenge path (/.well-known/acme-challenge/) to return 404;
    # this makes cert-manager inject the challenge path directly into this
    # ingress instead of creating a separate solver ingress that loses the
    # routing competition
    acme.cert-manager.io/http01-edit-in-place: "true"
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
  hosts:
    - host: "{{ .Values.host }}"
      paths:
        - path: "/api/v1/zenodo"
          pathType: Prefix
  tls:
    - hosts:
        - "{{ .Values.host }}"
      secretName: "scicat-exporter-certificate"

# Keep the pre-rename chart name so selectors and resource names still match
# releases installed from the vendored charts (Deployment selectors are immutable).
nameOverride: generic-service-chart

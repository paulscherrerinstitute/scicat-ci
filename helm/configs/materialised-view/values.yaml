image:
  repository: mongo
  pullPolicy: IfNotPresent
  tag: "8.3@sha256:747773029b84309981a3624a1af64ffc8c4d792283cc0834f26fe01fc6d28b34"

run:
  command: 
    - /bin/sh
  args: 
    - -c
    - >
      mongosh $MONGO_URI --file /updateMatViews.js

volumes:
  - name: config-volume
    configMap:
      name: "{{ .Release.Name }}-cm"
  - name: secrets-volume
    secret:
      secretName: "{{ .Release.Name }}-s"

secrets: 
  "{{ .Release.Name }}-s":
    type: Opaque
    data: 
      mongoURI: "{{ .Values.secretsJson.MV_MONGO_URI }}"

configMaps: 
  "{{ .Release.Name }}-cm":
    updateMatViews.js: "{{ .Values.MATERIALISE }}"

env:
  - name: MONGO_URI
    valueFrom:
      secretKeyRef: 
        name: "{{ .Release.Name }}-s"
        key: mongoURI

volumeMounts:
  - name: config-volume
    mountPath: /updateMatViews.js
    subPath: updateMatViews.js

# Keep the pre-rename chart name so resource names stay stable for the
# release installed from the vendored cron-chart.
nameOverride: cron-chart

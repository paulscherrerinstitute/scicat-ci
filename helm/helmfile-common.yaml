environments:
  development:
    values: [{sourceRepo: "", ciRepository: "", ciTag: ""}]
  qa:
    values: [{sourceRepo: "", ciRepository: "", ciTag: ""}]
  production:
    values: [{sourceRepo: "", ciRepository: "", ciTag: ""}]

helmDefaults:
  atomic: true
  wait: true
  createNamespace: true

# Inherited by a release whose ciTag has no published image. The hook builds that
# commit from sourceRepo and pushes it before helm pulls it.
# A published image always wins, the build only covers what nobody published.
#
# The expressions below resolve when the hook runs, not when this file is read.
templates:
  build:
    hooks:
      - events: ["presync"]
        showlogs: true
        command: bash
        args:
          - -c
          - |
            set -euo pipefail
            image="{{ .Values.ciRepository }}:{{ .Values.ciTag }}"
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "$image exists, skipping build"
              exit 0
            fi
            docker buildx build --push --tag "$image" \
              --label "org.opencontainers.image.revision={{ .Values.ciTag }}" \
              --label "org.opencontainers.image.source={{ .Values.sourceRepo }}" \
              "{{ .Values.sourceRepo }}.git#{{ .Values.ciTag }}"

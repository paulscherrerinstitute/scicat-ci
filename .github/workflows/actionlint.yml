name: actionlint

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          reporter: github-pr-review
          # the older workflows are not actionlint-clean
          filter_mode: file
          # without this nothing fails, and "error" would skip shellcheck's info findings
          fail_level: any

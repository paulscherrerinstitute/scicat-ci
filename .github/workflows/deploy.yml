name: deploy

# Deploys every component that owns a deployments/<product>/<component>/helmfile.yaml.gotmpl.
# That config holds the chart, the values, and the secrets the chart receives.
#
# Add the config and delete the component's own workflow in the same commit.
# Otherwise both run helm upgrade on the same release.
#
# PRs run it unfiltered so "deploy ok" reports on every PR and can be required;
# discover picks the components, and a PR changing none deploys nothing.

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - deployments/**
  release:
    types: [published]

permissions:
  contents: read

jobs:

  set_env:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/reusable.environment.yml

  discover:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.release.outputs.components || steps.changed.outputs.components }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag names its component, <product>/<component>-vX.Y.Z.
      - name: Select the released component
        id: release
        if: github.event_name == 'release'
        run: |
          set -euo pipefail

          name=${TAG%-v*}
          # Tags from before the products, <component>-vX.Y.Z, are SciCat's.
          if [[ "$name" != */* ]]; then name="scicat/$name"; fi
          # A component without a helmfile config deploys from its own workflow.
          if [ -f "deployments/$name/helmfile.yaml.gotmpl" ]; then
            components=$(jq -nc --arg name "$name" '[$name]')
          else
            components='[]'
          fi

          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "to deploy: $components"
        env:
          TAG: ${{ github.event.release.tag_name }}

      # On a PR, a change to the canary triggers deploys one component per chart
      # to development, not every component. Merged, it deploys nothing by itself.
      - name: Select the changed components
        id: changed
        if: github.event_name != 'release'
        uses: ./.github/actions/select-components
        with:
          components_root: deployments
          component_marker: helmfile.yaml.gotmpl
          component_depth: 2
          # a change here can change what every config renders
          all_components_triggers: deployments/*/helmfile-common.yaml
          canary_components_triggers: |
            .github/workflows/deploy.yml
            .github/actions/select-components/**
          # one per chart: generic-service, cron, proposals-cronjob; none once merged
          canary_components: >-
            ${{ github.event_name == 'pull_request'
              && 'scicat/search-api scicat/scicat-to-pss scicat/proposals' || '' }}

  deploy:
    needs:
      - set_env
      - discover
    # An empty list in strategy is an error, not an empty run.
    if: needs.discover.outputs.components != '[]'
    name: deploy ${{ matrix.component }}
    runs-on: ubuntu-latest
    # Every secret of this repository is scoped to an environment.
    environment: ${{ needs.set_env.outputs.environment }}
    permissions:
      contents: read
      # A state that names a source commit pushes the image it builds.
      packages: write
    strategy:
      fail-fast: false
      # Every deploy opens an ssh tunnel to the same bastion.
      max-parallel: 3
      matrix:
        component: ${{ fromJSON(needs.discover.outputs.components) }}
    concurrency:
      group: deploy-${{ matrix.component }}-${{ needs.set_env.outputs.environment }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open ssh tunnel
        uses: ./.github/actions/open-ssh-tunnel
        with:
          bastion_user: "${{ secrets.BASTION_USER }}"
          bastion_ssh_key: "${{ secrets.BASTION_SSH_KEY }}"

      # One sync per component, so a broken sibling cannot fail this one. Each
      # config names the secrets its chart receives out of the whole set.
      - name: deploy
        uses: ./.github/actions/deploy-helmfile
        with:
          file: deployments/${{ matrix.component }}/helmfile.yaml.gotmpl
          environment: "${{ needs.set_env.outputs.environment }}"
          kubeconfig: "${{ secrets.KUBECONFIG }}"
          secrets: ${{ toJSON(secrets) }}
          registry_token: "${{ secrets.GITHUB_TOKEN }}"

  deploy-ok:
    name: deploy ok
    if: always()
    needs: [set_env, discover, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}

name: test

# Tests the components whose source lives in this repo. Runs on every PR and
# picks inside which components to test. Jobs that don't apply are skipped,
# which "test ok" counts as passing, so "test ok" is the one check of this
# workflow to require on main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.select.outputs.components }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A component is a top-level folder with a compose.test.yml.
      - name: Select components to test
        id: select
        uses: ./.github/actions/select-components
        with:
          components_root: .
          component_marker: compose.test.yml
          # a change here tests every component
          all_components_triggers: |
            .github/workflows/test.yml
            .github/actions/select-components/**

  # Runs the test service of a component's compose.test.yml, which defines
  # what testing means for it, then builds its prod image.
  component:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    name: test ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: docker compose -f compose.test.yml run --rm --build test

      - name: Build prod
        run: docker build -t prod .

      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down

  test-ok:
    name: test ok
    if: always()
    needs: [changes, component]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}

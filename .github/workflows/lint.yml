name: lint

# Runs on every PR and picks inside which jobs apply. Jobs that don't apply
# are skipped, which "lint ok" counts as passing, so "lint ok" is the one
# check of this workflow to require on main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.states.outputs.matrix }}
      workflows: ${{ steps.workflows.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed workflows
        id: workflows
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: .github/workflows/**

      - name: Get changed helmfile base
        id: base
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            helm/helmfile-common.yaml

      # A change here renders one canary state, not every state.
      - name: Get changed lint workflow
        id: self
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: .github/workflows/lint.yml

      - name: Get changed component directories
        id: components
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: helm/configs/**
          dir_names: true
          dir_names_max_depth: 3
          matrix: true

      - name: Select helmfile states to render
        id: states
        run: |
          set -euo pipefail

          # a change to the shared base can affect every state
          if [ "$BASE_CHANGED" = "true" ]; then
            candidates=$(find helm/configs -name helmfile.yaml.gotmpl)
          else
            candidates=$(jq -r '.[] + "/helmfile.yaml.gotmpl"' <<< "$COMPONENTS")
          fi

          # Components not yet migrated to helmfile have no helmfile.yaml.gotmpl and are
          # silently skipped here (not rendered/linted by this job).
          matrix=$(printf '%s\n' "$candidates" | while read -r state; do
            if [ -f "$state" ]; then echo "$state"; fi
          done)

          # States rendered alongside already exercise the workflow.
          if [ "$SELF_CHANGED" = "true" ] && [ -z "$matrix" ]; then
            matrix=$CANARY
          fi
          matrix=$(printf '%s\n' "$matrix" | jq -ncR '[inputs | select(. != "")]')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        env:
          BASE_CHANGED: ${{ steps.base.outputs.any_changed }}
          SELF_CHANGED: ${{ steps.self.outputs.any_changed }}
          CANARY: helm/configs/proposals/helmfile.yaml.gotmpl
          COMPONENTS: ${{ steps.components.outputs.all_changed_files }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # review comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          reporter: github-pr-review
          # the older workflows are not actionlint-clean
          filter_mode: file
          # without this nothing fails, and "error" would skip shellcheck's info findings
          fail_level: any

  helmfile:
    needs: changes
    if: needs.changes.outputs.states != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        state: ${{ fromJSON(needs.changes.outputs.states) }}
        environment: [development, qa, production]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build placeholder secrets
        run: |
          set -euo pipefail

          # Configs dereference .Values.secretsJson.<KEY> unconditionally, so a render
          # needs every key present. The value is base64 because a `secrets:` block
          # feeds a k8s Secret, which rejects anything else.
          grep -rhoE 'secretsJson\.[A-Za-z0-9_]+' helm/configs \
            | cut -d. -f2 | sort -u | jq -R . \
            | jq -s '{secrets: (map({key: ., value: "ZHVtbXk="}) | from_entries)}' \
            > "$RUNNER_TEMP/placeholder-secrets.json"

      - name: Render state
        uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
        with:
          helmfile-args: >-
            --file ${{ matrix.state }}
            --environment ${{ matrix.environment }}
            --state-values-file ${{ runner.temp }}/placeholder-secrets.json
            template
          helmfile-version: v1.7.1
          helm-version: v4.2.2
          # a template run needs no plugin, the action installs helm-diff by default
          helm-plugins: ''

  lint-ok:
    name: lint ok
    if: always()
    needs: [changes, actionlint, helmfile]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
